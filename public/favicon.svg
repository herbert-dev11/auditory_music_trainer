<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Clave de sol estilizada, desenho próprio (plans/010). Cores da paleta do app: marrom #8a4b14 e creme #fbf3ea. -->
  <rect width="64" height="64" rx="14" fill="#8a4b14"/>
  <g fill="none" stroke="#fbf3ea" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Haste: de baixo até o alto -->
    <path d="M30 54 C31 40 34 22 35 7"/>
    <!-- Laço de cima, cruzando a haste -->
    <path d="M35 7 C23 9 21 21 31 25"/>
    <!-- Espiral de baixo, em volta da linha do sol -->
    <path d="M31 25 C42 31 44 45 33 47 C24 48 21 38 28 35 C33 33 37 37 35 41"/>
    <!-- Cauda curva no pé da haste -->
    <path d="M30 54 C30 58 24 59 23 55"/>
  </g>
  <circle cx="24.5" cy="54.5" r="3" fill="#fbf3ea"/>
</svg>
